<!-- OCI HEADER SECTION -->
<div class="oci-header-section">
  <div class="oci-tag">
    <span
      ><i class="bi bi-gear-fill" style="padding: 5px"></i> OCI Technology</span
    >
  </div>

  <h1 class="oci-title">
    One Intelligent Core.
    <span class="highlight-red">Endless Possibilities.</span>
  </h1>
  <p class="oci-description">
    At the center of QFREEMART is a unified engine that connects every function
    of commerce. Each capability strengthens the others.
  </p>
</div>

<!-- DIAGRAM SECTION -->
<div class="diagram-container">
  <!-- Center with rings -->
  <div class="center-circle show">
    <div class="inner-circle">
      <div class="text-oci">OCI</div>
      <div class="text-tech">Technology</div>
    </div>

    <div class="ring outer-ring"></div>
    <div class="ring middle-ring"></div>
  </div>

  <!-- Dynamic cards -->
  <div class="features-wrapper">
    <div class="lines-wrapper">
      <div
        class="feature-line"
        *ngFor="let feature of features; let i = index"
        [style.--i]="i"
        [style.--count]="features.length"
      >
        <div class="sparkle"></div>
      </div>
    </div>

    <div
      class="feature-item"
      *ngFor="let feature of features; let i = index"
      [style.--i]="i"
      [style.--count]="features.length"
    >
      <div class="icon">{{ feature.icon }}</div>
      <div class="text">{{ feature.text }}</div>
      <div class="more-details">
        {{ feature.details }}
      </div>
    </div>
  </div>
</div>
