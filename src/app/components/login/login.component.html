<div class="login-container">
  <div class="login-card">
    <div class="brand-header text-center mb-4">
      <img src="fullicon.png" alt="QFreeMart Logo" class="login-logo mb-2">
      <!-- <h2 class="text-primary fw-bold">QFreeMart</h2> -->
      <p class="text-muted small">Welcome back! Please login to your account.</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group mb-3">
        <label for="username" class="form-label">Username</label>
        <div class="input-group">
          <span class="input-group-text bg-white border-end-0">
            <i class="bi bi-person text-muted"></i>
          </span>
          <input type="email" id="username" formControlName="username" class="form-control border-start-0 ps-0"
            placeholder="Enter your email"
            [class.is-invalid]="loginForm.get('username')?.invalid && loginForm.get('username')?.touched">
        </div>
        <div *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched"
          class="text-danger small mt-1">
          Valid email is required.
        </div>
      </div>

      <div class="form-group mb-4">
        <label for="password" class="form-label">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-white border-end-0">
            <i class="bi bi-lock text-muted"></i>
          </span>
          <input type="password" id="password" formControlName="password" class="form-control border-start-0 ps-0"
            placeholder="Enter your password"
            [class.is-invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
        </div>
        <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
          class="text-danger small mt-1">
          Password is required.
        </div>
      </div>

      <div *ngIf="errorMessage" class="alert alert-danger py-2 mb-3 small d-flex align-items-center gap-2">
        <i class="bi bi-exclamation-circle-fill"></i>
        {{ errorMessage }}
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold btn-login" [disabled]="loginForm.invalid">
        Login
      </button>

      <!-- <div class="text-center mt-3">
          <a routerLink="/" class="text-decoration-none small text-muted">Back to Website</a>
      </div> -->
    </form>
  </div>
</div>
