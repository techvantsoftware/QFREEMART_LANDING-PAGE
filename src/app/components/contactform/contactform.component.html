<div class="contact-section">
  <div class="contact-container">
    <!-- Left Image Half -->
    <div class="image-side">
      <img src="/assets/imgcontact.png" alt="Customer support agent smiling with headset" class="contact-image" />
    </div>

    <!-- Right Form Half -->
    <div class="form-column">
      <div class="form-wrapper">
        <h1>We empower businesses to go digital.</h1>
        <p class="subheading">
          With smartphone usage at an all-time high, online shopping has become the preferred choice for today’s consumers.
        </p>

        <form>
          <div class="form-row">
            <div class="form-group">
              <label for="firstName">First name</label>
              <input type="text" id="firstName" class="form-control" placeholder="Your Name" />
            </div>
            <div class="form-group">
              <label for="lastName">Last name</label>
              <input type="text" id="lastName" class="form-control" placeholder="Last name" />
            </div>
          </div>

          <div class="form-group">
            <label for="subject">Your Subject</label>
            <input type="text" id="subject" class="form-control" placeholder="Subject" />
          </div>

          <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" class="form-control" placeholder="Write the message..."></textarea>
          </div>

          <button type="submit" class="send-message-btn">Send a Message</button>
        </form>
      </div>
    </div>
  </div>
</div>
