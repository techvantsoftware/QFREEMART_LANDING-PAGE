<div class="contact-section">
  <div class="contact-container">
    <!-- Left Image Half -->
    <div class="image-side">
      <img src="/assets/imgcontact.png" alt="Customer support" class="contact-image" />
    </div>

    <!-- Right Form Half -->
    <div class="form-column">
      <div class="form-wrapper">
        <h1>We empower businesses to go digital.</h1>
        <p class="subheading">
          With smartphone usage at an all-time high, online shopping has become the preferred choice.
        </p>

        <!-- (ngSubmit) calls the function defined in TypeScript -->
        <form [formGroup]="contactForm" (ngSubmit)="sendEmail()">
          <div class="form-row">
            <div class="form-group">
              <label for="firstName">First name</label>
              <input 
                type="text" 
                id="firstName" 
                formControlName="firstName" 
                class="form-control" 
                placeholder="Your Name" 
              />
            </div>
            <div class="form-group">
              <label for="lastName">Last name</label>
              <input 
                type="text" 
                id="lastName" 
                formControlName="lastName" 
                class="form-control" 
                placeholder="Last name" 
              />
            </div>
          </div>

          <div class="form-group">
            <label for="subject">Your Subject</label>
            <input 
              type="text" 
              id="subject" 
              formControlName="subject" 
              class="form-control" 
              placeholder="Subject" 
            />
          </div>

          <div class="form-group">
            <label for="message">Message</label>
            <textarea 
              id="message" 
              formControlName="message" 
              class="form-control" 
              placeholder="Write the message...">
            </textarea>
          </div>

          <!-- Button is disabled until form is valid -->
          <button 
            type="submit" 
            class="send-message-btn" 
            [disabled]="contactForm.invalid"
            [style.opacity]="contactForm.invalid ? '0.5' : '1'">
            Send Message
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
