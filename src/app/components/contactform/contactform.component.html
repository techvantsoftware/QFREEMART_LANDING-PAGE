<div class="contact-section container-fluid d-flex flex-wrap">
    <div class="row g-0">
        <!-- Left Image Half -->
        <div class="half-screen image-side d-flex align-items-center justify-content-center">
            <img src="/assets/imgcontact.png" alt="Customer support agent smiling with headset"
                class="img-fluid contact-image" />
        </div>
        <!-- Right Form Half -->
        <div class="col-lg-6 form-column ">
            <div class="form-container">
                <h1>We empower businesses to go digital.</h1>
                <p class="subheading">With smartphone usage at an all-time high, online shopping has become the
                    preferred choice for today’s consumers.</p>
                <form>
                    <div class="row">
                        <div class="col-md-6">
                            <label for="firstName" class="form-label mb-2">First name</label>
                            <input type="text" class="form-control" id="firstName" placeholder="Your Name">
                        </div>
                        <div class="col-md-6" style="padding-left: 90px;">
                            <label for="lastName" class="form-label mb-2 mx-3">Last name</label>
                            <input type="text" class="form-control" id="lastName" placeholder="Last name">
                        </div>
                    </div>

                    <div class="mb-3 mt-3">
                        <label for="subject" class="form-label mb-2">Your Subject</label>
                        <input type="text" class="form-control" id="subject" placeholder="Subject">
                    </div>

                    <div class="mb-4">
                        <label for="message" class="form-label mb-2">Message</label>
                        <textarea class="form-control" id="message" rows="4"
                            placeholder="Write the message..."></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary send-message-btn">Send a Message</button>
                </form>

            </div>
        </div>
    </div>
</div>
